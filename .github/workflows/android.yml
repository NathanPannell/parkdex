name: Android debug APK

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Staging API or the exact https://api-pr-<number>-<id>.up.railway.app preview API URL baked into the debug APK
        required: false
        default: https://api-staging-882c.up.railway.app
        type: string

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || 'https://api-staging-882c.up.railway.app' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify hosted Android toolchain
        run: |
          if [[ "$NEXT_PUBLIC_API_BASE_URL" != "https://api-staging-882c.up.railway.app" ]] && \
             ! [[ "$NEXT_PUBLIC_API_BASE_URL" =~ ^https://api-pr-[1-9][0-9]*-[a-z0-9]+\.up\.railway\.app$ ]]; then
            echo "api_base_url must be the staging API or an exact Railway PR preview API URL" >&2
            exit 1
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          java --version
          node --version
          "$ANDROID_HOME/platform-tools/adb" version
      - name: Configure stable staging debug signing
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_STAGING_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_STAGING_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_STAGING_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STAGING_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_STAGING_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_STAGING_DEBUG_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_STAGING_DEBUG_KEYSTORE_BASE64"
          test -n "$ANDROID_STAGING_DEBUG_KEYSTORE_PASSWORD"
          test -n "$ANDROID_STAGING_DEBUG_KEY_PASSWORD"
          key_store="$RUNNER_TEMP/parkdex-staging-debug.jks"
          printf '%s' "$ANDROID_STAGING_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          echo "PARKDEX_ANDROID_KEYSTORE_FILE=$key_store" >> "$GITHUB_ENV"
          echo "PARKDEX_ANDROID_KEYSTORE_PASSWORD=$ANDROID_STAGING_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PARKDEX_ANDROID_KEY_ALIAS=parkdex-staging-debug" >> "$GITHUB_ENV"
          echo "PARKDEX_ANDROID_KEY_PASSWORD=$ANDROID_STAGING_DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Sync Capacitor Android project
        run: npm run android:sync
        working-directory: frontend
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
        working-directory: frontend/android
      - name: Assemble Android instrumentation tests
        run: bash ./gradlew --no-daemon :app:assembleDebugAndroidTest
        working-directory: frontend/android
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native instrumentation tests on API 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: frontend/android
          script: |
            bash ./gradlew --no-daemon :app:connectedDebugAndroidTest
            bash ./gradlew --no-daemon :app:installDebug
            adb shell am start -W -n app.parkdex/.MainActivity
            adb shell pidof app.parkdex
            cd .. && ANDROID_SMOKE_ARTIFACT_DIR="$RUNNER_TEMP/android-smoke" node scripts/android-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parkdex-android-smoke
          path: ${{ runner.temp }}/android-smoke
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parkdex-android-test-reports
          path: frontend/android/app/build/reports/androidTests/connected
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parkdex-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
