name: Deploy staging

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && github.run_attempt == 1
    uses: ./.github/workflows/deploy-release.yml
    with:
      target: staging
      source_sha: ${{ github.sha }}
    secrets:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
