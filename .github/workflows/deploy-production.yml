name: Deploy Parkdex Kip production

on:
  push:
    branches:
      - main

concurrency:
  group: kip-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kip_qa
          POSTGRES_PASSWORD: kip_owned_ci_only
          POSTGRES_DB: kip_qa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kip_qa -d kip_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the exact production commit
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Write release identity
        run: python scripts/kip-delivery.py write-release --environment production --sha "$GITHUB_SHA"

      # Same command as the PR check and the local pre-push check.
      - name: Release checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: kip_qa
          PGPASSWORD: kip_owned_ci_only
          PGDATABASE: kip_qa_ci
        run: python scripts/kip-delivery.py ci-checks

      - name: Verify the production content channel
        run: python scripts/kip-delivery.py verify-main-content

      - name: Apply ordered additive migrations to Neon main
        env:
          KIP_PRODUCTION_RUNTIME_JSON: ${{ secrets.KIP_PRODUCTION_RUNTIME_JSON }}
          KIP_PRODUCTION_EXTRA_RUNTIME_JSON: ${{ secrets.KIP_PRODUCTION_EXTRA_RUNTIME_JSON }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_PRODUCTION }}
        run: python scripts/kip-delivery.py migrate-main --sha "$GITHUB_SHA" --apply

      - name: Install pinned deployment CLIs
        run: npm install --global vercel@50.1.3 wrangler@4.132.0

      - name: Queue exact production services concurrently
        env:
          KIP_PRODUCTION_RUNTIME_JSON: ${{ secrets.KIP_PRODUCTION_RUNTIME_JSON }}
          KIP_PRODUCTION_EXTRA_RUNTIME_JSON: ${{ secrets.KIP_PRODUCTION_EXTRA_RUNTIME_JSON }}
          VERCEL_PRODUCTION_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KIP_PRODUCTION_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_PRODUCTION }}
        run: |
          python scripts/kip-delivery.py deploy-main-services --sha "$GITHUB_SHA" --apply
          python scripts/finish-production-release.py
