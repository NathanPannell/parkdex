name: CI and manual deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: What should this run do?
        required: true
        default: none
        type: choice
        options: [none, deploy-staging, promote-production, verify-existing-staging]
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  verify-existing-staging:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && github.event_name == 'workflow_dispatch' && inputs.action == 'verify-existing-staging' && github.ref == 'refs/heads/fix/canonical-release-content' && github.actor == 'NathanPannell'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm install --global vercel@50.1.3
      - name: Verify existing staged deployment without deployment changes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: bash scripts/verify-frontend-release.sh https://staging.parkdex.app 54d1b1c0c9a4e3b8f8771fc711301133c024514c

  backend:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'none'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: app, POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python scripts/build_seed_migration.py --check
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m backend.app.migrate
      - run: python -m pytest backend/tests

  frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'none'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Validate repository data
        run: |
          node scripts/data-validate.mjs
          npm run boundaries:test
          node scripts/boundary-validate.mjs
          node --test scripts/release-metadata.test.mjs
          node --test scripts/deployment-workflows.test.mjs
          bash scripts/deployment-helpers.test.sh
      - name: Resolve build metadata
        id: release
        run: node scripts/release-metadata.mjs "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: frontend
      - name: Test and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          NEXT_PUBLIC_COMMIT_DATE: ${{ steps.release.outputs.commit_date }}
        run: |
          node scripts/check-boundary-asset.mjs
          npm run check:exploration-territories
          npm run lint
          npm run typecheck
          npm test
          npm run build

  resolve-release:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && github.event_name == 'workflow_dispatch' && (inputs.action == 'deploy-staging' || inputs.action == 'promote-production') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Pin the latest staging commit
        id: source
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq '.object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test-release:
    needs: resolve-release
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: app, POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ needs.resolve-release.outputs.sha }}", fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend
        run: |
          python scripts/build_seed_migration.py --check
          python -m pip install -r backend/requirements-dev.txt
          python -m backend.app.migrate
          python -m pytest backend/tests
      - run: npm ci
      - name: Validate repository data
        run: |
          node scripts/data-validate.mjs
          npm run boundaries:test
          node scripts/boundary-validate.mjs
          node --test scripts/release-metadata.test.mjs
          node --test scripts/deployment-workflows.test.mjs
          bash scripts/deployment-helpers.test.sh
      - name: Resolve build metadata
        id: release
        run: node scripts/release-metadata.mjs "${{ needs.resolve-release.outputs.sha }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: frontend
      - name: Test and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          NEXT_PUBLIC_COMMIT_DATE: ${{ steps.release.outputs.commit_date }}
        run: |
          node scripts/check-boundary-asset.mjs
          npm run check:exploration-territories
          npm run lint
          npm run typecheck
          npm test
          npm run build

  deploy-staging:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && inputs.action == 'deploy-staging'
    needs: [resolve-release, test-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency: { group: release-staging, cancel-in-progress: false }
    environment: { name: staging, url: "https://staging.parkdex.app" }
    env:
      EXPECTED_COMMIT_SHA: ${{ needs.resolve-release.outputs.sha }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_BASE_ENVIRONMENT_ID: ${{ vars.RAILWAY_BASE_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: staging
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STAGING_DOMAIN: staging.parkdex.app
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ env.EXPECTED_COMMIT_SHA }}", fetch-depth: 0 }
      - name: Refuse a stale staging release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq '.object.sha')" = "$EXPECTED_COMMIT_SHA"
      - name: Create or reuse persistent Neon staging branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: staging
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: app
          role: app_owner
          suspend_timeout: 300
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Resolve release metadata
        id: release
        run: node scripts/release-metadata.mjs "$EXPECTED_COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - name: Install deployment CLIs
        run: npm install --global @railway/cli@5.47.2 vercel@50.1.3
      - name: Configure persistent Railway staging
        env:
          STAGING_DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          STAGING_DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          STAGING_GOOGLE_CLIENT_ID: ${{ vars.STAGING_GOOGLE_CLIENT_ID }}
          STAGING_GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
        run: |
          source scripts/railway-retry.sh
          : "${STAGING_GOOGLE_CLIENT_ID:?STAGING_GOOGLE_CLIENT_ID is required}"
          : "${STAGING_GOOGLE_CLIENT_SECRET:?STAGING_GOOGLE_CLIENT_SECRET is required}"
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_BASE_ENVIRONMENT_ID"
          if ! railway environment list --json | jq -e --arg name "$RAILWAY_ENVIRONMENT" '.. | objects | select(.name? == $name)' >/dev/null; then
            railway environment new "$RAILWAY_ENVIRONMENT" \
              --copy "$RAILWAY_BASE_ENVIRONMENT_ID" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.DATABASE_URL.value "$STAGING_DATABASE_URL" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.DATABASE_URL_UNPOOLED.value "$STAGING_DATABASE_URL_UNPOOLED" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.FRONTEND_ORIGINS.value "https://$STAGING_DOMAIN" \
              --service-config "$RAILWAY_WORKER_SERVICE_ID" variables.DATABASE_URL.value "$STAGING_DATABASE_URL"
          fi
          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WORKER_SERVICE_ID"; do
            railway_retry "$STAGING_DATABASE_URL" variable set DATABASE_URL --stdin --skip-deploys --service "$service" --environment staging --project "$RAILWAY_PROJECT_ID"
            railway_retry "$EXPECTED_COMMIT_SHA" variable set APP_COMMIT_SHA --stdin --skip-deploys --service "$service" --environment staging --project "$RAILWAY_PROJECT_ID"
            railway service source disconnect --service "$service" --environment staging --project "$RAILWAY_PROJECT_ID" >/dev/null
          done
          railway_retry "$STAGING_DATABASE_URL_UNPOOLED" variable set DATABASE_URL_UNPOOLED --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment staging --project "$RAILWAY_PROJECT_ID"
          railway_retry "https://$STAGING_DOMAIN" variable set FRONTEND_ORIGINS --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment staging --project "$RAILWAY_PROJECT_ID"
          railway_retry "https://$STAGING_DOMAIN" variable set APP_PUBLIC_URL --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment staging --project "$RAILWAY_PROJECT_ID"
          railway_retry "https://$STAGING_DOMAIN/auth/google/callback" variable set GOOGLE_REDIRECT_URI --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment staging --project "$RAILWAY_PROJECT_ID"
          railway_retry "$STAGING_GOOGLE_CLIENT_ID" variable set GOOGLE_CLIENT_ID --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment staging --project "$RAILWAY_PROJECT_ID"
          railway_retry "$STAGING_GOOGLE_CLIENT_SECRET" variable set GOOGLE_CLIENT_SECRET --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment staging --project "$RAILWAY_PROJECT_ID"
      - name: Deploy Railway services and wait on provider events
        run: |
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT_SHA" ]]
          source_marker=backend/.staging-source-sha
          trap 'rm -f "$source_marker"' EXIT
          deployment_message="staging-source $EXPECTED_COMMIT_SHA run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          printf '%s' "$deployment_message" > "$source_marker"
          railway up --ci --yes --message "$deployment_message" --service "$RAILWAY_API_SERVICE_ID" --environment staging --project "$RAILWAY_PROJECT_ID" & api_pid=$!
          railway up --ci --yes --message "$deployment_message" --service "$RAILWAY_WORKER_SERVICE_ID" --environment staging --project "$RAILWAY_PROJECT_ID" & worker_pid=$!
          wait "$api_pid"
          wait "$worker_pid"
          bash scripts/verify-railway-deployments.sh "$deployment_message"
      - name: Verify staging services
        id: railway
        run: |
          bash scripts/wait-for-railway-api.sh & api_pid=$!
          bash scripts/wait-for-worker-catalogue.sh & worker_pid=$!
          wait "$api_pid"
          wait "$worker_pid"
      - name: Smoke test staging catalogue
        env: { API_URL: "${{ steps.railway.outputs.api_url }}" }
        run: bash scripts/smoke-catalogue.sh
      - name: Deploy and alias staging frontend
        env: { API_URL: "${{ steps.railway.outputs.api_url }}" }
        run: |
          deployment_url="$(vercel deploy --yes --target preview --cwd frontend --build-env NEXT_PUBLIC_API_BASE_URL="$API_URL" --build-env NEXT_PUBLIC_RELEASE_VERSION="${{ steps.release.outputs.version }}" --build-env NEXT_PUBLIC_COMMIT_SHA="${{ steps.release.outputs.commit_sha }}" --build-env NEXT_PUBLIC_COMMIT_DATE="${{ steps.release.outputs.commit_date }}" --meta githubCommitSha="$EXPECTED_COMMIT_SHA" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")"
          vercel alias set "$deployment_url" "$STAGING_DOMAIN" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          bash scripts/verify-frontend-release.sh "https://$STAGING_DOMAIN" "$EXPECTED_COMMIT_SHA"

  promote-production:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && inputs.action == 'promote-production'
    needs: [resolve-release, test-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency: { group: release-staging, cancel-in-progress: false }
    permissions: { contents: write }
    environment: { name: production, url: "https://parkdex.app" }
    env:
      EXPECTED_COMMIT_SHA: ${{ needs.resolve-release.outputs.sha }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: production
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ env.EXPECTED_COMMIT_SHA }}", fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Resolve release metadata
        id: release
        run: node scripts/release-metadata.mjs "$EXPECTED_COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - name: Install deployment CLIs
        run: npm install --global @railway/cli@5.47.2 vercel@50.1.3
      - name: Verify exact staged frontend and API releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq '.object.sha')" == "$EXPECTED_COMMIT_SHA" ]]
          bash scripts/verify-frontend-release.sh "https://staging.parkdex.app" "$EXPECTED_COMMIT_SHA"
          domain="$(railway domain list --project "$RAILWAY_PROJECT_ID" --environment staging --service "$RAILWAY_API_SERVICE_ID" --json | jq -r '.. | strings | select(test("\\.up\\.railway\\.app$"))' | head -n 1)"
          [[ -n "$domain" ]]
          response="$(curl --fail --silent --show-error "https://$domain/ready")"
          [[ "$(jq -r '.status' <<<"$response")" == ready ]]
          [[ "$(jq -r '.commit' <<<"$response")" == "$EXPECTED_COMMIT_SHA" ]]
      - name: Disconnect production Git sources before updating main
        run: |
          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WORKER_SERVICE_ID"; do
            railway service source disconnect --service "$service" --environment production --project "$RAILWAY_PROJECT_ID" >/dev/null
          done
      - name: Fast-forward main to the staged commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git fetch origin main staging
          [[ "$(git rev-parse origin/staging)" == "$EXPECTED_COMMIT_SHA" ]]
          git merge-base --is-ancestor "$(git rev-parse origin/main)" "$EXPECTED_COMMIT_SHA"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$EXPECTED_COMMIT_SHA" -F force=false >/dev/null
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$EXPECTED_COMMIT_SHA" ]]
      - name: Configure production release
        run: |
          source scripts/railway-retry.sh
          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WORKER_SERVICE_ID"; do
            railway_retry "$EXPECTED_COMMIT_SHA" variable set APP_COMMIT_SHA --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
          done
          railway_retry 'https://parkdex.app,https://www.parkdex.app' variable set FRONTEND_ORIGINS --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          railway_retry 'https://parkdex.app' variable set APP_PUBLIC_URL --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          railway_retry 'https://parkdex.app/auth/google/callback' variable set GOOGLE_REDIRECT_URI --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
      - name: Deploy Railway services and wait on provider events
        run: |
          source_marker=backend/.production-source-sha
          trap 'rm -f "$source_marker"' EXIT
          deployment_message="production-source $EXPECTED_COMMIT_SHA run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          printf '%s' "$deployment_message" > "$source_marker"
          railway up --ci --yes --message "$deployment_message" --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID" & api_pid=$!
          railway up --ci --yes --message "$deployment_message" --service "$RAILWAY_WORKER_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID" & worker_pid=$!
          wait "$api_pid"
          wait "$worker_pid"
          bash scripts/verify-railway-deployments.sh "$deployment_message"
      - name: Verify production services
        id: railway
        run: |
          bash scripts/wait-for-railway-api.sh & api_pid=$!
          bash scripts/wait-for-worker-catalogue.sh & worker_pid=$!
          wait "$api_pid"
          wait "$worker_pid"
      - name: Smoke test production catalogue
        env: { API_URL: "${{ steps.railway.outputs.api_url }}" }
        run: bash scripts/smoke-catalogue.sh
      - name: Deploy production frontend
        env: { API_URL: "${{ steps.railway.outputs.api_url }}" }
        run: |
          vercel deploy --prod --yes --cwd frontend --build-env NEXT_PUBLIC_API_BASE_URL="$API_URL" --build-env NEXT_PUBLIC_RELEASE_VERSION="${{ steps.release.outputs.version }}" --build-env NEXT_PUBLIC_COMMIT_SHA="${{ steps.release.outputs.commit_sha }}" --build-env NEXT_PUBLIC_COMMIT_DATE="${{ steps.release.outputs.commit_date }}" --meta githubCommitSha="$EXPECTED_COMMIT_SHA" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          bash scripts/verify-frontend-release.sh "https://parkdex.app" "$EXPECTED_COMMIT_SHA"
