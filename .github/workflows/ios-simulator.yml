name: iOS simulator check

# A deeper iOS check than the PR checks' simulator build, run only by hand because macOS minutes
# cost ten times Linux ones (about 12 minutes, so about 120 of the free plan's 2,000):
#
# 1. The same unsigned simulator build as pr-checks.yml.
# 2. A launch smoke test on an iPhone 6.9-inch simulator: the app must still be running after 40
#    seconds (so registering Parkdex's own native plugins did not crash it), and a screenshot of
#    the screen it reached is uploaded as an artifact.
# 3. The TestFlight archive (Release, generic iOS device, unsigned) and the ad-hoc entitlement
#    signing that ios-testflight.yml runs before export, so the first TestFlight run cannot fail on
#    the archive or the entitlements. It needs no Apple account.
#
# Start it by pushing a tag `ios-simulator/<label>` at the commit to check (works from any branch),
# or from the Actions tab once this file is on main.
on:
  workflow_dispatch:
  push:
    tags:
      - "ios-simulator/*"

concurrency:
  group: kip-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: iOS simulator build, launch and archive
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run ios:sync

      - name: The committed iOS project matches cap sync
        run: |
          if [ -n "$(git status --porcelain -- ios)" ]; then
            git status --short -- ios
            git diff -- ios
            echo "::error::cap sync changed the committed iOS project. Run npm run ios:sync and commit the result."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: ios/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: spm-${{ runner.os }}-

      - name: xcodebuild for the iOS simulator, unsigned
        run: |
          xcodebuild -version
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/DerivedData \
            -clonedSourcePackagesDirPath ios/SourcePackages \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch on a 6.9-inch iPhone simulator
        run: |
          shots="$RUNNER_TEMP/simulator"
          mkdir -p "$shots"
          echo "SHOTS=$shots" >> "$GITHUB_ENV"
          # The newest iPhone Pro Max the runner has: the 6.9-inch display App Store screenshots use.
          device="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          pro_max = sorted((d for d in devices if re.search(r"iPhone \d+ Pro Max", d["name"])), key=lambda d: int(re.search(r"\d+", d["name"]).group()))
          print(pro_max[-1]["udid"] if pro_max else "")
          ')"
          [ -n "$device" ] || { echo "::error::No iPhone Pro Max simulator is available on this runner."; exit 1; }
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl privacy "$device" grant location app.parkdex || true
          # Victoria, BC, inside the bundled catalogue.
          xcrun simctl location "$device" set 48.4284,-123.3656 || true
          xcrun simctl launch "$device" app.parkdex
          sleep 40
          xcrun simctl io "$device" screenshot "$shots/launch.png"
          if ! xcrun simctl spawn "$device" launchctl list | grep -q "UIKitApplication:app.parkdex"; then
            xcrun simctl spawn "$device" log show --last 2m --predicate 'process == "App"' --style compact | tail -100 || true
            echo "::error::Parkdex was no longer running 40 seconds after launch."
            exit 1
          fi
          xcrun simctl spawn "$device" log show --last 2m --predicate 'process == "App" AND (eventMessage CONTAINS[c] "error" OR eventMessage CONTAINS[c] "plugin")' --style compact > "$shots/app-log.txt" || true
          echo "Parkdex launched and kept running on $(xcrun simctl list devices | grep "$device" | head -1 | xargs)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch
          path: ${{ env.SHOTS }}
          if-no-files-found: ignore
          retention-days: 14

      - name: TestFlight archive, unsigned, then the entitlement signing
        run: |
          archive="$RUNNER_TEMP/Parkdex.xcarchive"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive" \
            -clonedSourcePackagesDirPath ios/SourcePackages \
            CODE_SIGNING_ALLOWED=NO
          bash scripts/ios-sign-archive.sh "$archive"
          {
            echo "### iOS simulator check"
            echo "- Simulator build: passed"
            echo "- Launch on a 6.9-inch simulator: still running after 40 s (screenshot in the ios-simulator-launch artifact)"
            echo "- Release archive and entitlement signing: passed"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
