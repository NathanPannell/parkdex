name: PR checks

# The merge gate for every PR into staging (and the staging to main release PR). It runs on draft
# PRs too: merge only when every job is green on the PR's head commit. There are no preview
# deployments; nothing here calls the Neon, Vercel or Cloudflare APIs or uses a secret. The e2e
# browser reads the public content CDN (kip-assets.parkdex.app) without credentials.
on:
  pull_request:
    branches:
      - staging
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: kip-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"

jobs:
  # Install from the lockfile, types, unit and integration tests with their coverage floors, the
  # production web build, delivery tests, and the SQL QA: every migration applied from scratch to a
  # throwaway Postgres 18 database, content sync and legacy import QA, and the account SQL tests.
  # The same command runs in the staging and production deploy workflows.
  release-checks:
    name: Release checks (types, tests, build, SQL QA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kip_qa
          POSTGRES_PASSWORD: kip_owned_ci_only
          POSTGRES_DB: kip_qa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kip_qa -d kip_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Release checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: kip_qa
          PGPASSWORD: kip_owned_ci_only
          PGDATABASE: kip_qa_ci
        run: python scripts/kip-delivery.py ci-checks

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: npm ci
      - run: pip install -r scripts/requirements-lint.txt

      - name: Prettier
        run: npm run format:check

      - name: ESLint, zero warnings
        run: npm run lint

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

  # Playwright, headless, against the production web build served by vite preview and the real API
  # on a fresh Postgres 18 database (e2e/api-server.ts). Covers the main signed-out journeys.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kip_qa
          POSTGRES_PASSWORD: kip_owned_ci_only
          POSTGRES_DB: kip_qa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kip_qa -d kip_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: kip_qa
      PGPASSWORD: kip_owned_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: npm ci
      # bootstrap-content.py seeds the e2e database and needs psycopg.
      - run: pip install -r database/delivery-test-requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Playwright
        run: npm run e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The operator dashboard is its own Vite app. Each of its six PostgreSQL suites gets a fresh database.
  operator:
    name: Operator dashboard (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kip_qa
          POSTGRES_PASSWORD: kip_owned_ci_only
          POSTGRES_DB: kip_qa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kip_qa -d kip_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            operator/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      # The dashboard's server imports the shared worker modules, so it needs the root packages too.
      - run: npm ci
      - run: npm ci --prefix operator
      - run: npm run typecheck --prefix operator

      - name: Create one fresh database per PostgreSQL suite
        env:
          PGPASSWORD: kip_owned_ci_only
        run: |
          for name in drafts parks park_manager ota analytics analytics_legacy; do
            psql -h 127.0.0.1 -U kip_qa -d kip_qa_ci -c "CREATE DATABASE kip_qa_operator_${name}"
          done

      - name: Tests
        env:
          OPERATOR_DRAFTS_TEST_DATABASE_URL: postgresql://kip_qa:kip_owned_ci_only@127.0.0.1:5432/kip_qa_operator_drafts
          OPERATOR_PARKS_TEST_DATABASE_URL: postgresql://kip_qa:kip_owned_ci_only@127.0.0.1:5432/kip_qa_operator_parks
          OPERATOR_PARK_MANAGER_TEST_DATABASE_URL: postgresql://kip_qa:kip_owned_ci_only@127.0.0.1:5432/kip_qa_operator_park_manager
          OPERATOR_OTA_TEST_DATABASE_URL: postgresql://kip_qa:kip_owned_ci_only@127.0.0.1:5432/kip_qa_operator_ota
          OPERATOR_ANALYTICS_TEST_DATABASE_URL: postgresql://kip_qa:kip_owned_ci_only@127.0.0.1:5432/kip_qa_operator_analytics
          OPERATOR_ANALYTICS_LEGACY_TEST_DATABASE_URL: postgresql://kip_qa:kip_owned_ci_only@127.0.0.1:5432/kip_qa_operator_analytics_legacy
        run: npm test --prefix operator

      - run: npm run build --prefix operator

  # The Capacitor Android debug build. It needs no signing secrets; release builds stay local.
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run android:sync

      - name: Gradle assembleDebug
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

  # macOS minutes cost ten times Linux ones, so the iOS build runs only when a PR touches
  # something that can break the native project. The answer comes from the PR's file list.
  ios-changes:
    name: iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
    steps:
      - name: Look for iOS-relevant files in the PR
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          count="$(printf '%s\n' "$files" | grep -c . || true)"
          # The API lists at most 3,000 files; build when the list may be cut short.
          if [ "$count" -ge 3000 ] || printf '%s\n' "$files" | grep -qE'^(ios/|package(-lock)?\.json$|capacitor\.config\.ts$|scripts/cap-sync\.mjs$|scripts/check-content-package\.mjs$|\.github/workflows/(pr-checks|ios-testflight)\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS simulator build skipped::No file under ios/ or the Capacitor and package config changed."
          fi

  # The unsigned iOS simulator build, so the Xcode project cannot break silently. It needs no
  # Apple account or secrets. TestFlight builds run in ios-testflight.yml.
  ios:
    name: iOS simulator build
    needs: ios-changes
    if: needs.ios-changes.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run ios:sync

      - name: The committed iOS project matches cap sync
        run: |
          if [ -n "$(git status --porcelain -- ios)" ]; then
            git status --short -- ios
            git diff -- ios
            echo "::error::cap sync changed the committed iOS project. Run npm run ios:sync and commit the result."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: ios/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: spm-${{ runner.os }}-

      - name: xcodebuild for the iOS simulator, unsigned
        run: |
          xcodebuild -version
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/DerivedData \
            -clonedSourcePackagesDirPath ios/SourcePackages \
            CODE_SIGNING_ALLOWED=NO

  security:
    name: Security (audit, secrets, env files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (app)
        run: npm audit --audit-level=high

      - name: npm audit (operator dashboard)
        run: npm audit --audit-level=high --prefix operator

      - name: Install gitleaks
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks

      - name: gitleaks, whole history and working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner

      # Vite mode files (.env.field, .env.production-field) are public build settings: every VITE_
      # value ships in the app. Any other committed env file, or any other key, fails.
      - name: No committed secrets in env files
        run: |
          status=0
          while IFS= read -r file; do
            case "$(basename "$file")" in
              .env.field | .env.production-field) ;;
              *) echo "::error file=$file::Env files must not be committed"; status=1; continue ;;
            esac
            if grep -nvE '^[[:space:]]*(#.*)?$|^VITE_[A-Z0-9_]+=' "$file"; then
              echo "::error file=$file::Only VITE_ settings may be committed in $file"
              status=1
            fi
          done < <(git ls-files | grep -E '(^|/)(\.env(\..*)?|\.dev\.vars)$')
          exit $status
