name: iOS TestFlight

# Builds the iOS app on a macOS runner and uploads it to TestFlight. Never automatic: a run costs
# about 15 macOS minutes, which the free plan bills at ten times Linux minutes. See docs/ios.md.
#
# Start it either way:
# - Actions > iOS TestFlight > Run workflow (once this file is on main, the default branch), or
# - push a tag `ios-testflight/<channel>/<label>`, for example `ios-testflight/staging/1`, at the
#   commit to build. Tags work from any branch.
#
# Signing is automatic and needs no certificate or profile in the repository. The archive is built
# unsigned; the export signs it with the team's cloud-managed distribution certificate through the
# App Store Connect API key and uploads it. Without the four secrets the run stops with a notice.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Web build and API the app uses (build:field or build:field:production)
        type: choice
        options:
          - production
          - staging
        default: production
      marketing_version:
        description: Version shown to testers, for example 1.0.1. Blank keeps the project's MARKETING_VERSION.
        required: false
        default: ""
  push:
    tags:
      - "ios-testflight/staging/*"
      - "ios-testflight/production/*"

concurrency:
  group: kip-ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A Linux job decides whether there is anything to do, so a run without secrets costs no macOS time.
  preflight:
    name: Secrets and inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      channel: ${{ steps.check.outputs.channel }}
      marketing_version: ${{ steps.check.outputs.marketing_version }}
    steps:
      - name: Check the App Store Connect secrets and the inputs
        id: check
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # refs/tags/ios-testflight/<channel>/<label>
            channel="$(echo "$GITHUB_REF" | cut -d/ -f4)"
            marketing_version=""
          else
            channel="$INPUT_CHANNEL"
            marketing_version="$(echo "$INPUT_MARKETING_VERSION" | xargs)"
          fi
          case "$channel" in
            staging | production) ;;
            *) echo "::error::Unknown channel '$channel'. Use staging or production."; exit 1 ;;
          esac
          if [ -n "$marketing_version" ] && ! [[ "$marketing_version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::marketing_version must be one to three numbers separated by dots, for example 1.0.1."
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"

          missing=()
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_API_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            message="Missing repository secrets: ${missing[*]}. Nothing was built. The one-time Apple setup is in docs/ios.md."
            echo "::notice title=TestFlight upload skipped::$message"
            echo "### TestFlight upload skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Catch pasted values with the wrong shape before a macOS runner starts.
          problems=()
          [[ "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || problems+=("APP_STORE_CONNECT_KEY_ID must be the 10-character key ID")
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || problems+=("APPLE_TEAM_ID must be the 10-character team ID")
          [[ "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || problems+=("APP_STORE_CONNECT_ISSUER_ID must be the issuer UUID from the Integrations page")
          grep -q -- "-----BEGIN PRIVATE KEY-----" <<< "$APP_STORE_CONNECT_API_KEY_P8" || problems+=("APP_STORE_CONNECT_API_KEY_P8 must be the full contents of the .p8 file, BEGIN and END lines included")
          if [ "${#problems[@]}" -gt 0 ]; then
            for problem in "${problems[@]}"; do echo "::error::$problem"; done
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  testflight:
    name: Archive and upload to TestFlight
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      MARKETING_VERSION_INPUT: ${{ needs.preflight.outputs.marketing_version }}
      # Unique and rising for every run and re-run of this workflow (CFBundleVersion allows dots).
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      ARCHIVE_PATH: ${{ runner.temp }}/Parkdex.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/export
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production or staging web build, synced into iOS
        run: |
          if [ "$CHANNEL" = "production" ]; then npm run ios:sync:production; else npm run ios:sync; fi

      - name: The committed iOS project matches cap sync
        run: |
          if [ -n "$(git status --porcelain -- ios)" ]; then
            git status --short -- ios
            echo "::error::cap sync changed the committed iOS project. Run npm run ios:sync and commit the result."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: ios/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Archive, unsigned
        run: |
          xcodebuild -version
          versions=(CURRENT_PROJECT_VERSION="$BUILD_NUMBER")
          if [ -n "$MARKETING_VERSION_INPUT" ]; then versions+=(MARKETING_VERSION="$MARKETING_VERSION_INPUT"); fi
          # Signing here would need a development certificate and a registered device. The export signs instead.
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath ios/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            "${versions[@]}"

      - name: Write the App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key_dir="$RUNNER_TEMP/app-store-connect"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Sign with the cloud distribution certificate and upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$options"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Summary
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$ARCHIVE_PATH/Info.plist")"
          {
            echo "### Uploaded to TestFlight"
            echo "- Version $version, build $BUILD_NUMBER"
            echo "- Channel: $CHANNEL"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo "App Store Connect processes the build before testers can install it, usually within 30 minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/app-store-connect"
