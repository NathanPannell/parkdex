name: Merged PR preview cleanup gate

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == vars.TRUSTED_PREVIEW_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Require exact journal-owned cleanup
        uses: actions/github-script@v8
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { cleanupDisposition } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-cleanup-disposition.mjs`);
            const result = cleanupDisposition(Number(process.env.PULL_REQUEST));
            core.warning(result.message);
            await core.summary
              .addHeading('Merged preview cleanup is unresolved')
              .addRaw(result.message)
              .write();
            core.setFailed(result.message);
