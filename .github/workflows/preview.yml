name: Full-stack PR preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
  RAILWAY_BASE_ENVIRONMENT_ID: ${{ vars.RAILWAY_BASE_ENVIRONMENT_ID }}
  RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
  RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Preview creation is disabled; the closed-PR cleanup job below remains active.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set Neon safety expiration
        id: expiry
        run: echo "expires_at=$(date -u -d '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or reuse Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.expiry.outputs.expires_at }}
          database: app
          role: app_owner

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve preview metadata
        id: release
        run: node scripts/release-metadata.mjs "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Install deployment CLIs
        run: npm install --global @railway/cli@5.47.2 vercel@50.1.3

      - name: Create or update isolated Railway environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PREVIEW_DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          PREVIEW_DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source scripts/railway-retry.sh
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_BASE_ENVIRONMENT_ID"
          if railway environment list --json | jq -e --arg name "$PREVIEW_ENVIRONMENT" '.. | objects | select(.name? == $name)' >/dev/null; then
            echo "Railway environment already exists; updating it in place."
          else
            railway environment new "$PREVIEW_ENVIRONMENT" \
              --copy "$RAILWAY_BASE_ENVIRONMENT_ID" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.PREVIEW_DATABASE_URL.value "$PREVIEW_DATABASE_URL" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.PREVIEW_DATABASE_URL_UNPOOLED.value "$PREVIEW_DATABASE_URL_UNPOOLED" \
              --service-config "$RAILWAY_WORKER_SERVICE_ID" variables.PREVIEW_DATABASE_URL.value "$PREVIEW_DATABASE_URL"
          fi

          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WORKER_SERVICE_ID"; do
            railway_retry "$PREVIEW_DATABASE_URL" variable set PREVIEW_DATABASE_URL --stdin --skip-deploys --service "$service" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"
            railway_retry "$EXPECTED_COMMIT_SHA" variable set APP_COMMIT_SHA --stdin --skip-deploys --service "$service" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"
          done
          railway_retry "$PREVIEW_DATABASE_URL_UNPOOLED" variable set PREVIEW_DATABASE_URL_UNPOOLED --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

      - name: Deploy Railway preview services
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source_marker=backend/.preview-source-sha
          trap 'rm -f "$source_marker"' EXIT
          deployment_message="preview-source $EXPECTED_COMMIT_SHA run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          printf '%s' "$deployment_message" > "$source_marker"
          export EXPECTED_PREVIEW_DEPLOYMENT_MESSAGE="$deployment_message"
          railway up --detach --yes --message "$deployment_message" --service "$RAILWAY_API_SERVICE_ID" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"
          railway up --detach --yes --message "$deployment_message" --service "$RAILWAY_WORKER_SERVICE_ID" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"
          bash scripts/wait-for-railway-preview-source.sh

      - name: Wait for the exact migrated API commit
        id: railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ env.PREVIEW_ENVIRONMENT }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/wait-for-railway-api.sh

      - name: Deploy one Vercel preview
        id: vercel
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          preview_url="$(vercel deploy --yes --target preview --cwd frontend \
            --build-env NEXT_PUBLIC_API_BASE_URL="$API_URL" \
            --build-env NEXT_PUBLIC_RELEASE_VERSION="${{ steps.release.outputs.version }}" \
            --build-env NEXT_PUBLIC_COMMIT_SHA="${{ steps.release.outputs.commit_sha }}" \
            --build-env NEXT_PUBLIC_COMMIT_DATE="${{ steps.release.outputs.commit_date }}" \
            --meta githubCommitSha="$HEAD_SHA" \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")"
          deployment_id="$(vercel inspect "$preview_url" --json --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" | jq -r '.id')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Trust the exact preview origin
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          source scripts/railway-retry.sh
          railway_retry "$PREVIEW_URL" variable set FRONTEND_ORIGINS --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"
          railway_retry '' redeploy --yes --service "$RAILWAY_API_SERVICE_ID" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

      - name: Verify final preview API readiness
        id: final-railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ env.PREVIEW_ENVIRONMENT }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/wait-for-railway-api.sh

      - name: Verify catalogue state and worker database read
        env:
          API_URL: ${{ steps.final-railway.outputs.api_url }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ env.PREVIEW_ENVIRONMENT }}
        run: |
          bash scripts/smoke-catalogue.sh
          bash scripts/wait-for-worker-catalogue.sh

      - name: Post or update preview summary
        uses: actions/github-script@v8
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.vercel.outputs.deployment_id }}
        with:
          script: |
            const marker = '<!-- full-stack-preview -->';
            const body = `${marker}\nFull-stack preview is ready.\n\nFrontend: ${process.env.PREVIEW_URL}\n\nAPI readiness: ${process.env.API_URL}/ready\n\nDatabase: Neon branch \`${process.env.NEON_BRANCH}\`\n\nVercel deployment: \`${process.env.VERCEL_DEPLOYMENT_ID}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  cleanup:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == vars.TRUSTED_PREVIEW_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install deployment CLIs
        run: npm install --global @railway/cli@5.47.2 vercel@50.1.3

      - name: Refuse cleanup outside the PR namespace
        run: |
          [[ "$PREVIEW_ENVIRONMENT" == "pr-${{ github.event.pull_request.number }}" ]]
          [[ "$NEON_BRANCH" == "preview/pr-${{ github.event.pull_request.number }}" ]]

      - name: Find recorded Vercel deployment
        id: vercel
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- full-stack-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const body = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(`${marker}\n`)
            )?.body || '';
            const match = body.match(/^Vercel deployment: `(dpl_[A-Za-z0-9]+)`$/m);
            core.setOutput('deployment_id', match?.[1] || '');

      - name: Delete Railway preview environment
        continue-on-error: true
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_BASE_ENVIRONMENT_ID"
          railway environment delete "$PREVIEW_ENVIRONMENT" --yes

      - name: Delete Neon preview branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Delete Vercel preview deployment
        if: steps.vercel.outputs.deployment_id != ''
        continue-on-error: true
        env:
          DEPLOYMENT_ID: ${{ steps.vercel.outputs.deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel remove "$DEPLOYMENT_ID" --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
